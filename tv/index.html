<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cockpit TV</title>
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0b0d;color:#f2f2f4;font:22px -apple-system,Segoe UI,Roboto,sans-serif;gap:22px}
h1{font-size:42px;margin:0}p{color:#8a8a93;margin:0}#c{font:600 46px ui-monospace,monospace;letter-spacing:14px;min-height:56px}
.pad{display:grid;grid-template-columns:repeat(3,110px);gap:14px}.pad button{font:600 34px inherit;height:84px;border:0;border-radius:18px;background:#222;color:#fff}
.pad .ok{background:#e31937}</style></head>
<body><h1>Cockpit TV</h1><p>Code affiché dans l'app Cockpit (Films › Écran de la voiture)</p><div id="c"></div>
<div class="pad" id="pad"></div>
<script>
const SERVER="https://macbook-pro-de-shane.tail2a4ab9.ts.net:8443";let code="";const c=document.getElementById("c"),pad=document.getElementById("pad");
const keys=["1","2","3","4","5","6","7","8","9","⌫","0","OK"];
for(const k of keys){const b=document.createElement("button");b.textContent=k;if(k==="OK")b.className="ok";b.onclick=()=>{if(k==="⌫")code=code.slice(0,-1);else if(k==="OK"){if(code.length===6)location.href=SERVER+"/tv?pin="+code;return;}else if(code.length<6)code+=k;c.textContent=code.replace(/./g,"•");if(code.length===6)location.href=SERVER+"/tv?pin="+code;};pad.appendChild(b);}
</script></body></html>
